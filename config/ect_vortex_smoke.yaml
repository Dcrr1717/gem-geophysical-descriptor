# Tiny, offline pipeline check for the ECT / DECT study (CI; ~2 min on 2 cores).
# Numbers from this config are NOT results; use config/ect_vortex.yaml.
base_config: config/hard_benchmark_smoke.yaml
out_dir: results/smoke
n_workers: 2
figures: true

ect_study:
  feature_cache_dir: data/ect_vortex_smoke
  report_stem: ect_vortex_smoke
  n_repeats: 1
  dect:
    enabled: true             # skipped automatically when torch is not installed
    epochs: 2
    batch_size: 16
    lr: 0.003
    weight_decay: 0.0001
    n_dirs: 8
    n_t: 8
    sharpness: 40.0
  rule:
    min_margin: 0.05

vortex_events:
  cache_dir: data/vortex_events_smoke
  grid: 64
  dt: 0.02
  nu: 0.002
  drag: 0.0
  radius: 0.5
  amplitude: 5.0
  background_rms: 0.05
  background_band: [2, 8]
  merge_range: [2.0, 2.6]
  separate_range: [6.0, 7.0]
  runs_per_class: 4
  first_snapshot_time: 2.0
  snapshot_interval: 1.0
  snapshots_per_run: 3

vortex_pilot:
  ratios: [2.0, 6.5]
  repeats: 1
  duration: 6
