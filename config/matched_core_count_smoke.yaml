# Tiny, offline pipeline check for the matched core-count study (CI; ~2 min on
# 2 cores). The gate is deliberately lenient. Numbers from this config are NOT
# results; use config/matched_core_count.yaml.
base_config: config/hard_benchmark_smoke.yaml
out_dir: results/smoke
n_workers: 2
figures: true

ect_study:
  n_repeats: 1
  dect:
    enabled: true             # skipped automatically when torch is not installed
    epochs: 2
    batch_size: 16
    lr: 0.003
    weight_decay: 0.0001
    n_dirs: 8
    n_t: 8
    sharpness: 40.0
    head: flat
  rule:
    min_margin: 0.05

core_count:
  cache_dir: data/core_count_smoke
  grid: 64
  dt: 0.02
  nu: 0.002
  amplitude: 5.0
  background_rms: 0.05
  background_band: [2, 8]
  steepness: [2.0, 6.0]
  single_radius: [0.6, 1.0]
  single_aspect: [1.5, 3.0]
  single_steepness: [3.0, 6.0]
  pair_radius: [0.5, 0.8]
  pair_size_ratio: [0.6, 0.9]
  pair_amp_ratio: [0.7, 1.0]
  pair_steepness: [2.0, 5.0]
  pair_separation: [4.0, 6.0]
  max_separation: 3.0
  runs_per_class: 8
  first_snapshot_time: 0.5
  snapshot_interval: 0.5
  snapshots_per_run: 3

core_count_pilot:
  runs_per_class: 4
  snapshots_per_run: 2

matching:
  method: propensity
  degree: 2
  caliper_sd: 0.5
  gate:                       # lenient: pipeline check only
    max_abs_smd: 5.0
    variance_ratio: [0.01, 100.0]
    min_pairs: 2
    max_design_auc: 1.0
