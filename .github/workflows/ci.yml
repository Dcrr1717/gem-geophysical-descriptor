name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only torch (DECT view), then the requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest
      - name: Unit tests (offline)
        run: python -m pytest -q
      - name: ECT / DECT pipeline smoke run (offline, tiny config)
        run: python -m src.eval.ect_benchmark --config config/ect_vortex_smoke.yaml
